<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concall Player – sign in</title>
<style>
  :root { --bg: #f6f6f8; --card: #fff; --text: #1d1d22; --muted: #6b6b76; --line: #e2e2e8; --accent: #5b45d6; --bad: #c62f3a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16161a; --card: #222228; --text: #ececf1; --muted: #a0a0ab; --line: #34343c; --accent: #8b78ff; --bad: #ff6b74; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 16px; }
  form { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 28px; width: 100%; max-width: 360px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p { color: var(--muted); margin: 0 0 18px; font-size: 14px; }
  input { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; font: inherit;
          background: var(--bg); color: var(--text); }
  button { margin-top: 12px; width: 100%; padding: 10px; border: 0; border-radius: 8px; background: var(--accent);
           color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .6; }
  #msg { color: var(--bad); font-size: 14px; min-height: 1.5em; margin-top: 10px; }
</style>
</head>
<body>
<form id="f">
  <h1>Concall Player</h1>
  <p>Enter the password you set in Concall Player's Settings.</p>
  <input id="pw" type="password" autocomplete="current-password" placeholder="Password" autofocus required>
  <button id="go">Sign in</button>
  <div id="msg"></div>
</form>
<script>
document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("go"), msg = document.getElementById("msg");
  btn.disabled = true; msg.textContent = "";
  try {
    const r = await fetch("/api/remote/login", {
      method: "POST", headers: { "Content-Type": "application/json", "X-Concall": "1" },
      body: JSON.stringify({ password: document.getElementById("pw").value }),
    });
    const d = await r.json().catch(() => ({}));
    if (r.ok && d.ok) { location.href = "/"; return; }
    msg.textContent = d.error || "Couldn't sign in. Is the computer running Concall Player still on?";
  } catch { msg.textContent = "Couldn't reach Concall Player. Is the computer running it still on?"; }
  btn.disabled = false;
});
</script>
</body>
</html>
