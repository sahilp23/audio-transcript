name: Mac & Windows app + website

# Every push: run the tests, build the Mac app (.dmg) on a real Mac and the
# Windows installer (.exe) on a real Windows PC, install each fresh and
# transcribe a spoken sample. Then publish both:
#   main          -> release vX.Y.Z (once per version; the app's updater sees it)
#   other branches -> the "preview" pre-release (for trying changes before merging)
on:
  push:
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mac-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests
        run: |
          python -m pip install -q -r requirements-web.txt pytest httpx reportlab
          python -m pytest -q tests

      - name: Build app
        run: |
          python -m pip install -q pillow
          packaging/macos/build_app.sh dist

      - name: Test the built app (fresh install + real transcription)
        env:
          # Optional repository secrets; the related tests are skipped without them.
          CI_GROQ_KEY: ${{ secrets.GROQ_API_KEY }}
          CI_GLADIA_KEY: ${{ secrets.GLADIA_API_KEY }}
          CI_HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: packaging/smoke_test.sh "dist/Concall Player.app"

      - uses: actions/upload-artifact@v4
        with:
          name: Concall-Player-mac
          path: dist/Concall-Player.dmg

  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests
        run: |
          python -m pip install -q -r requirements-web.txt pytest httpx reportlab
          python -m pytest -q tests

      - name: Install Inno Setup (if the runner doesn't have it)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build installer
        run: |
          python -m pip install -q pillow
          python packaging/windows/build.py dist

      - name: Install it like a user would (silently)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\Concall-Player-Setup.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer exited with $($p.ExitCode)" }
          Get-ChildItem "$env:LOCALAPPDATA\Programs\Concall Player"
          Get-Content "$env:LOCALAPPDATA\Concall Player\logs\setup.log" -ErrorAction SilentlyContinue | Select-Object -Last 20

      - name: Test the installed app (fresh setup + real transcription)
        env:
          CI_GROQ_KEY: ${{ secrets.GROQ_API_KEY }}
          CI_GLADIA_KEY: ${{ secrets.GLADIA_API_KEY }}
          CI_HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: packaging/smoke_test.sh "$(cygpath -m "$LOCALAPPDATA/Programs/Concall Player")"

      - uses: actions/upload-artifact@v4
        with:
          name: Concall-Player-windows
          path: dist/Concall-Player-Setup.exe

  website:
    # The hosted version (Render, docs/WEBSITE.md): install it the way Render does and check it starts.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install like Render (requirements-web.txt) and start
        env:
          CONCALL_WEB: "1"
          GOOGLE_CLIENT_ID: ci-client
          GOOGLE_CLIENT_SECRET: ci-secret
          ALLOWED_EMAILS: ci@example.com
          SECRET_KEY: ci-secret-key
          PUBLIC_URL: https://concall-ci.example
        run: |
          python -m venv /tmp/web && /tmp/web/bin/pip install -q -r requirements-web.txt
          /tmp/web/bin/uvicorn concall.server:app --host 127.0.0.1 --port 10000 > /tmp/web.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:10000/api/ping && break; sleep 1; done
          curl -sf http://127.0.0.1:10000/api/ping
          test "$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' http://127.0.0.1:10000/)" = "302 http://127.0.0.1:10000/auth/login"
          curl -s -o /dev/null -w '%{redirect_url}\n' http://127.0.0.1:10000/auth/login | grep -q "^https://accounts.google.com/o/oauth2/v2/auth?client_id=ci-client"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:10000/api/calls)" = "401"
          echo "✓ website starts and requires Google sign-in"
          cat /tmp/web.log

  publish:
    needs: [mac, windows, website]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          FILES="dist/Concall-Player.dmg dist/Concall-Player-Setup.exe"
          VERSION="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' concall/__init__.py)"
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            if gh release view "v$VERSION" >/dev/null 2>&1; then
              echo "v$VERSION already released; bump concall/__init__.py to publish a new version."
              exit 0
            fi
            # Release notes = this version's section of CHANGELOG.md
            awk -v v="$VERSION" '/^## /{p = ($2 == v)} p && !/^## /' CHANGELOG.md > notes.md
            gh release create "v$VERSION" $FILES --target "$GITHUB_SHA" \
              --title "Concall Player $VERSION" --notes-file notes.md --latest
          else
            gh release delete preview --yes --cleanup-tag >/dev/null 2>&1 || true
            gh release create preview $FILES --target "$GITHUB_SHA" --prerelease \
              --title "Preview: $GITHUB_REF_NAME ($VERSION)" \
              --notes "Test build from branch \`$GITHUB_REF_NAME\` (commit ${GITHUB_SHA::7}). Not offered as an in-app update."
          fi
